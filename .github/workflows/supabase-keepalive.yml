name: Supabase Keep-Alive

on:
  schedule:
    # Twice weekly — well within Supabase's 7-day inactivity window
    - cron: "0 12 * * 1"
    - cron: "0 12 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            "${BASE_URL}/rest/v1/published_posts?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP status: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Supabase keep-alive ping failed."
            exit 1
          fi

          echo "Supabase keep-alive ping succeeded."
